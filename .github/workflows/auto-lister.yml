name: Auto Lister

on:
  workflow_dispatch:
    inputs:
      transaction_csv:
        description: "Optional CSFloat transaction CSV path to import into the PnL workbook"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-lister
  cancel-in-progress: false

jobs:
  run-auto-lister:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock encrypted files
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key
          rm git-crypt-key

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-lister
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          CSFLOAT_STEAM_ID: ${{ secrets.CSFLOAT_STEAM_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CONSOLE_LOG_LEVEL: ERROR
          STALL_RELIST_ENABLED: "true"
          STALL_RELIST_CONFIRM: LOCKED_PRICE_RELIST
          STALL_RELIST_MAX_PER_RUN: "3"
          STALL_RELIST_DELAY_SECONDS: "120"
        run: python bot.py

      - name: Import CSFloat transaction CSV
        if: ${{ github.event.inputs.transaction_csv != '' }}
        run: python import_csfloat_transactions.py "${{ github.event.inputs.transaction_csv }}"

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add config.json bot_state.json relist_counts.json manual_sales.json prev_inventory_assets.txt new_inventory_assets.txt relisted_formatted.txt listing_ledger.json stall_tracker_state.json transaction_import_state.json unmatched_sales.csv CS_GO_PnL_Tracker_Final.xlsx CS_GO_PnL_Tracker_Final_IMPORT_BACKUP.xlsx
          git diff --cached --quiet || git commit -m "auto: update lister state"
          git pull --rebase origin main
          git push origin HEAD:main
