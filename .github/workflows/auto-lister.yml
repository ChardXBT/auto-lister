name: Auto Lister

on:
  workflow_dispatch:
    inputs:
      transaction_csv:
        description: "Optional CSFloat transaction CSV path to import into the PnL workbook"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-lister
  cancel-in-progress: false

jobs:
  run-auto-lister:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before run
        run: |
          set +x
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout -B main origin/main

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock encrypted files
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key
          rm git-crypt-key

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-lister
        id: auto_lister
        continue-on-error: true
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          CSFLOAT_RUKIA_API_KEY: ${{ secrets.CSFLOAT_RUKIA_API_KEY }}
          CSFLOAT_STEAM_ID: ${{ secrets.CSFLOAT_STEAM_ID }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          # Temporarily disabled: Steam summary counts do not identify the exact
          # outgoing asset when detailed offer data is empty.
          STEAM_TRADE_GUARD_ENABLED: "false"
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAILY_TRACKER_DISCORD_WEBHOOK: ${{ secrets.DAILY_TRACKER_DISCORD_WEBHOOK }}
          CONSOLE_LOG_LEVEL: ERROR
          STALL_RELIST_ENABLED: "true"
          STALL_RELIST_CONFIRM: LOCKED_PRICE_RELIST
          STALL_RELIST_MAX_PER_RUN: "3"
          STALL_RELIST_DELAY_SECONDS: "120"
        run: |
          python bot.py > /tmp/auto-lister.out 2>/tmp/auto-lister.err || {
            echo "Auto-lister failed. Console output suppressed to avoid leaking private listing data."
            exit 1
          }

      - name: Import CSFloat transaction CSV
        if: ${{ steps.auto_lister.outcome == 'success' && github.event.inputs.transaction_csv != '' }}
        run: |
          python import_csfloat_transactions.py "${{ github.event.inputs.transaction_csv }}" --reconcile-existing > /tmp/transaction-import.out 2>/tmp/transaction-import.err || {
            echo "Transaction CSV import failed. Console output suppressed to avoid leaking private listing data."
            exit 1
          }

      - name: Commit and push updated state
        if: ${{ always() && steps.auto_lister.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          set +x

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Stage all generated lister state under data/.
          # This avoids missing newly-created state files and leaving the worktree dirty.
          git add -A data/

          if git diff --cached --quiet; then
            echo "No lister state changes to commit."
          else
            git commit -m "auto: update lister state"
          fi

          # Main can move while the bot is running.
          # Rebase safely, then retry push if another run/manual commit moved main.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main

            if git push origin HEAD:main; then
              echo "Auto-lister state pushed successfully."
              exit 0
            fi

            echo "Push failed because main moved or was temporarily unavailable. Retrying..."
            sleep $((attempt * 10))
          done

          echo "Failed to push auto-lister state after 3 attempts."
          git status --short
          exit 1

      - name: Report auto-lister failure
        if: ${{ steps.auto_lister.outcome == 'failure' }}
        run: |
          echo "Auto-lister failed. Persisted state and private logs were committed for diagnosis."
          exit 1
