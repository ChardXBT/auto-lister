name: Auto Lister

on:
  workflow_dispatch:
    inputs:
      transaction_csv:
        description: "Optional CSFloat transaction CSV path to import into the PnL workbook"
        required: false
        default: ""
      accounts:
        description: "Optional run-only account override: main, rukia, or main,rukia"
        required: false
        default: ""
      preflight_only:
        description: "Read-only account identity/inventory/listing validation (zero marketplace mutations)"
        required: false
        type: boolean
        default: false
      transaction_account:
        description: "Account that owns transaction_csv contracts"
        required: false
        type: choice
        options:
          - main
          - rukia
        default: main

permissions:
  contents: write

concurrency:
  group: auto-lister
  cancel-in-progress: false
  queue: single

jobs:
  run-auto-lister:
    runs-on: ubuntu-24.04
    # Operator cap: 90 minutes per run. The bot stops starting listings at
    # 65 minutes and the run step hard-stops at 82, so the state commit below
    # always runs; whatever did not list waits for the next run.
    timeout-minutes: 90

    steps:
      - name: Harden runner
        timeout-minutes: 3
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # disable-telemetry is only accepted together with egress-policy: block.
          egress-policy: audit

      - name: Announce pending egress allowlist
        timeout-minutes: 1
        run: |
          echo "::notice title=Harden-Runner audit mode::Block mode is a separate follow-up; intended allowlist: github.com, *.githubusercontent.com, pypi.org, files.pythonhosted.org, archive.ubuntu.com, security.ubuntu.com, csfloat.com, discord.com"

      - name: Check out repository
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Full history (commits and trees), but file contents only for the
          # checked-out commit; older ones are fetched when read. The repo's
          # encrypted state history is many GB, which made a full checkout
          # take ~4 minutes per run; this takes ~30 seconds. Only the daily
          # cost-basis rebuild reads old config versions (~100 small fetches).
          filter: blob:none
          persist-credentials: false

      - name: Sync latest main before run
        timeout-minutes: 5
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Prepare git-crypt
        timeout-minutes: 8
        run: bash .github/scripts/prepare_git_crypt.sh

      - name: Unlock encrypted files
        timeout-minutes: 3
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key
          rm git-crypt-key

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 7
        env:
          PIP_RETRIES: "5"
        run: pip install --disable-pip-version-check --no-index --find-links .github/vendor/wheels -r requirements.txt

      - name: Run auto-lister
        id: auto_lister
        continue-on-error: true
        # Hard stop below the job's 90 minutes so the state commit below
        # always runs. The bot stops starting listings at 65 minutes
        # (AUTO_LISTER_LISTING_BUDGET_MINUTES), so this is only a backstop.
        timeout-minutes: 82
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          CSFLOAT_RUKIA_API_KEY: ${{ secrets.CSFLOAT_RUKIA_API_KEY }}
          CSFLOAT_STEAM_ID: ${{ secrets.CSFLOAT_STEAM_ID }}
          CSFLOAT_RUKIA_STEAM_ID: ${{ secrets.CSFLOAT_RUKIA_STEAM_ID }}
          # Empty/unset is interpreted by Python as Main-only. Rukia is never
          # enabled merely because its API key exists.
          AUTO_LISTER_ACCOUNTS: ${{ vars.AUTO_LISTER_ACCOUNTS }}
          AUTO_LISTER_ACCOUNTS_OVERRIDE: ${{ github.event.inputs.accounts }}
          AUTO_LISTER_PREFLIGHT_ONLY: ${{ github.event.inputs.preflight_only }}
          AUTO_LISTER_TRANSACTION_CSV: ${{ github.event.inputs.transaction_csv }}
          AUTO_LISTER_TRANSACTION_ACCOUNT: ${{ github.event.inputs.transaction_account || 'main' }}
          # No new listing starts after this many minutes of the process;
          # sized for the 90-minute job (code default is 95).
          AUTO_LISTER_LISTING_BUDGET_MINUTES: "65"
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          # Temporarily disabled: Steam summary counts do not identify the exact
          # outgoing asset when detailed offer data is empty.
          STEAM_TRADE_GUARD_ENABLED: "false"
          # Read-only CSFloat refunded-trades scan for trade reversals; hours
          # between scans, 0 = at the start of every run.
          REVERSAL_API_CHECK_INTERVAL_HOURS: "0"
          # When a run lists nothing new from config, move up to this many
          # buy-now listings with a known purchase cost to auction (config
          # items stuck on buy-now first, then cheapest). See AUCTION_FALLBACK.md.
          AUCTION_FALLBACK_ENABLED: "true"
          AUCTION_FALLBACK_ACCOUNTS: main,rukia
          AUCTION_FALLBACK_MAX_PER_RUN: "5"
          UNLISTED_INVENTORY_ALERT_ACCOUNTS: main,rukia
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAILY_TRACKER_DISCORD_WEBHOOK: ${{ secrets.DAILY_TRACKER_DISCORD_WEBHOOK }}
          CONSOLE_LOG_LEVEL: ERROR
          STALL_RELIST_ENABLED: "true"
          STALL_RELIST_CONFIRM: LOCKED_PRICE_RELIST
          STALL_RELIST_MAX_PER_RUN: "3"
          STALL_RELIST_DELAY_SECONDS: "120"
        run: |
          args=()
          if [[ "${AUTO_LISTER_PREFLIGHT_ONLY}" == "true" ]]; then
            args+=(--preflight-only)
          fi
          if [[ -n "${AUTO_LISTER_ACCOUNTS_OVERRIDE}" ]]; then
            args+=(--accounts "${AUTO_LISTER_ACCOUNTS_OVERRIDE}")
          fi
          if [[ -n "${AUTO_LISTER_TRANSACTION_CSV}" && "${AUTO_LISTER_PREFLIGHT_ONLY}" != "true" ]]; then
            args+=(--transaction-csv "${AUTO_LISTER_TRANSACTION_CSV}")
            args+=(--transaction-account "${AUTO_LISTER_TRANSACTION_ACCOUNT}")
          fi
          set +e
          python bot.py "${args[@]}" > /tmp/auto-lister.out 2>/tmp/auto-lister.err
          lister_exit=$?
          set -e
          if [[ "${AUTO_LISTER_PREFLIGHT_ONLY}" == "true" && -s /tmp/auto-lister.out ]]; then
            # Python emits an identifier-free account/config summary even for
            # a fail-closed preflight. Normal live output remains suppressed.
            cat /tmp/auto-lister.out
          fi
          if [[ "${lister_exit}" -ne 0 ]]; then
            echo "Auto-lister failed. Private console details were suppressed."
            exit "${lister_exit}"
          fi

      - name: Commit and push updated state
        if: ${{ always() && steps.auto_lister.outcome != 'skipped' }}
        timeout-minutes: 10
        env:
          RUNTIME_CHECKPOINT_BRANCH: main
          # Stage all generated lister state under data/, including new files.
          RUNTIME_CHECKPOINT_FILES: "data/"
          RUNTIME_CHECKPOINT_MESSAGE: "auto: update lister state"
          # Encrypted state cannot be merged and is not rebuilt by the next
          # run: a conflicting replay keeps this run's commit on
          # rescue/run-<id>-<attempt> for manual reconciliation (DEV_LOG: Git
          # push/rebase conflict), and the run stays green.
          RUNTIME_CHECKPOINT_RESCUE_ON_CONFLICT: "true"
          GH_PUSH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/checkpoint_runtime.sh

      - name: Report auto-lister failure
        if: ${{ steps.auto_lister.outcome == 'failure' }}
        timeout-minutes: 1
        run: |
          echo "Auto-lister failed. Persisted state and private logs were committed for diagnosis."
          exit 1
