name: Auto Lister

on:
  workflow_dispatch:
    inputs:
      transaction_csv:
        description: "Optional CSFloat transaction CSV path to import into the PnL workbook"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-lister
  cancel-in-progress: false

jobs:
  run-auto-lister:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock encrypted files
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key
          rm git-crypt-key

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-lister
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          CSFLOAT_STEAM_ID: ${{ secrets.CSFLOAT_STEAM_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAILY_TRACKER_DISCORD_WEBHOOK: ${{ secrets.DAILY_TRACKER_DISCORD_WEBHOOK }}
          CONSOLE_LOG_LEVEL: ERROR
          STALL_RELIST_ENABLED: "true"
          STALL_RELIST_CONFIRM: LOCKED_PRICE_RELIST
          STALL_RELIST_MAX_PER_RUN: "3"
          STALL_RELIST_DELAY_SECONDS: "120"
        run: |
          python bot.py > /tmp/auto-lister.out 2>/tmp/auto-lister.err || {
            echo "Auto-lister failed. Console output suppressed to avoid leaking private listing data."
            exit 1
          }

      - name: Import CSFloat transaction CSV
        if: ${{ github.event.inputs.transaction_csv != '' }}
        run: |
          python import_csfloat_transactions.py "${{ github.event.inputs.transaction_csv }}" --reconcile-existing > /tmp/transaction-import.out 2>/tmp/transaction-import.err || {
            echo "Transaction CSV import failed. Console output suppressed to avoid leaking private listing data."
            exit 1
          }

      - name: Commit updated state
        run: |
          set +x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add data/auction_bot.log data/config.json data/bot_state.json data/relist_counts.json data/manual_sales.json data/manual_price_updates.json data/prev_inventory_assets.txt data/new_inventory_assets.txt data/relisted_formatted.txt data/daily_tradable_items.json data/daily_tracker_state.json data/cost_basis.json data/listing_recovery.json data/listing_recovery.txt data/listing_ledger.json data/stall_tracker_state.json data/transaction_import_state.json data/unmatched_sales.csv data/monthly_extra_sales.json data/workbooks/CS_GO_PnL_Tracker_Final.xlsx data/workbooks/CS_GO_PnL_Tracker_Final_IMPORT_BACKUP.xlsx
          git diff --cached --quiet || git commit -m "auto: update lister state"
          git pull --rebase origin main
          git push origin HEAD:main
